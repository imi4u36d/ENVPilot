name: Release macOS app

# 触发点：
#   - 打 tag（v1.0.0）→ 测试 + 构建 + 签名 + DMG/ZIP + 建 Release（唯一自动触发路径）
#   - 在网页上手动 Run workflow → 只出 artifact
# 注意：push 到 main、开/更新 PR 都不会再触发本工作流。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（例如 v0.6.0）；留空则使用当前 commit 的短 SHA"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ENVPilot.app
    # Package.swift 要求 Swift 6.2+，macos-26 镜像自带 Xcode 26.6（Swift 6.3）。
    # macos-15 的 Swift 太旧，别改回去。
    runs-on: macos-26
    timeout-minutes: 40
    # 签名证书的两个 Secret（ENVPILOT_SIGNING_P12 / ENVPILOT_SIGNING_P12_PASSWORD）
    # 挂在这个 Environment 上并设了 required reviewers：
    # job 先卡在「等待批准」，批准之后才把 Secret 下发。所以即使有人能推 tag，
    # 也拿不到私钥。Secret 没配时导入步骤跳过，create_dmg.sh 回退 ad-hoc。
    environment: release-signing
    permissions:
      contents: write # 只有打 tag 那条路径要建 Release，其余步骤用不到
    steps:
      # action 按 commit SHA 钉死（注释里标原 tag）：Secret 会进这个 job，
      # 浮动的 major tag 一旦被投毒，等于把私钥递出去。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # 算短 SHA 与 Release notes 需要完整历史

      - name: Show toolchain
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcode-select -p
          swift --version

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="$GITHUB_REF_NAME"
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="0.0.0-dev+${GITHUB_SHA:0:7}"
          fi
          # CFBundleShortVersionString 只接受数字与点，去掉前缀 v。
          NUMERIC="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "numeric=$NUMERIC" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (CFBundleShortVersionString=$NUMERIC)"

      - name: Run tests
        run: swift test

      # 把签名证书放进一个一次性的临时钥匙串。runner 跑完就销毁，钥匙串不会留下。
      # Secret 没配（比如新克隆的仓库）就直接跳过，create_dmg.sh 会自己回退
      # ad-hoc——那里是有意为之的兜底，不是故障。
      # 注意：secret 不能直接写进 `if:`，所以这里用 env + shell 判断。
      - name: Import signing certificate
        env:
          SIGNING_P12: ${{ secrets.ENVPILOT_SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.ENVPILOT_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_P12}" ]]; then
            echo "未配置 ENVPILOT_SIGNING_P12，跳过导入；create_dmg.sh 将回退 ad-hoc。"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/envpilot-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$SIGNING_P12" | base64 -D > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" \
            -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          rm -f "$RUNNER_TEMP/signing.p12"
          # 必须进搜索列表：create_dmg.sh 用 `security find-identity -v -p codesigning`
          # 判断身份在不在，而那个命令只看搜索列表里的钥匙串。
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"

      # 一条脚本走完：swift build -c release → 组装 .app → 签名 → 打 DMG → sha256。
      # 版本号经 APP_VERSION 注入；签名身份自动取搜索列表里第一个有效身份。
      - name: Create DMG
        env:
          APP_VERSION: ${{ steps.version.outputs.numeric }}
          APP_BUILD: ${{ github.run_number }}
        run: ./scripts/create_dmg.sh

      - name: Verify bundle
        run: |
          set -euo pipefail
          APP="dist/ENVPilot.app"
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | grep -E 'Authority|Signature' || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"
          test -x "$APP/Contents/Resources/bin/envpilot-helper"
          # 少了这个目录，发出去的包在中文系统上菜单全是英文
          test -f "$APP/Contents/Resources/zh-Hans.lproj/Localizable.strings"
          test -f "dist/ENVPilot.dmg.sha256"
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/ENVPilot.zip
          ls -lh dist/ENVPilot.dmg dist/ENVPilot.zip

      # 发布说明里的签名状态直接读自打出来的包：ad-hoc 与真证书各写各的提醒。
      # 正文后面会接上 CHANGELOG.md 里对应那一节，Release 页和仓库里的变更日志不会各写各的。
      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NUMERIC: ${{ steps.version.outputs.numeric }}
        run: |
          set -euo pipefail
          AUTH="$(codesign -dv dist/ENVPilot.app 2>&1 | awk -F'= ' '/Authority=/{print $2; exit}')"
          if [[ -z "${AUTH}" || "${AUTH}" == "-"* ]]; then
            SIGN_NOTE='> 本构建为 ad-hoc 签名、未经 Apple 公证。首次打开若提示「已损坏」或「无法验证开发者」，
            > 请执行 `xattr -dr com.apple.quarantine /Applications/ENVPilot.app`，或在
            > 「系统设置 ▸ 隐私与安全性」中允许打开。'
          else
            SIGN_NOTE="> 本构建已用 Apple Developer 证书签名（${AUTH}）。若提示无法验证开发者，
            > 请在「系统设置 ▸ 隐私与安全性」中允许打开。"
          fi
          cat > dist/release-notes.md <<NOTES
          ENVPilot ${VERSION}

          ## 安装

          1. 下载下方的 \`ENVPilot.dmg\`。
          2. 打开后把 ENVPilot 拖到「应用程序」目录。

          ${SIGN_NOTE}

          ## 系统要求

          - macOS 14 或更高版本
          - Apple Silicon（arm64）

          \`ENVPilot.zip\` 是未经压缩的 app 包，供需要校验或自行签名的场景使用。
          NOTES

          # 附上版本更新日志：从 CHANGELOG.md 抽出「## v<版本>」到下一个二级标题之间的内容。
          # 抽不到就跳过（Release 正文只留安装说明），不要让缺一节变更日志把发布卡住。
          if CHANGELOG_SECTION="$(awk -v ver="${NUMERIC}" '
                index($0, "## v" ver) == 1 { found = 1; next }
                found && index($0, "## ") == 1 { exit }
                found { print }
              ' CHANGELOG.md)" && [[ -n "${CHANGELOG_SECTION//[[:space:]]/}" ]]; then
            printf '\n%s\n' "${CHANGELOG_SECTION}" >> dist/release-notes.md
          else
            echo "CHANGELOG.md 里没有 v${NUMERIC} 一节，Release 正文只含安装说明。" >&2
          fi
          cat dist/release-notes.md

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ENVPilot-${{ steps.version.outputs.version }}
          path: |
            dist/ENVPilot.dmg
            dist/ENVPilot.zip
            dist/ENVPilot.dmg.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          test -f dist/ENVPilot.dmg
          test -f dist/ENVPilot.zip
          if gh release view "$tag" >/dev/null 2>&1; then
            # tag 被重推过：覆盖同名资产，并用最新构建的状态刷新正文。
            gh release upload "$tag" dist/ENVPilot.dmg dist/ENVPilot.zip dist/ENVPilot.dmg.sha256 --clobber
            gh release edit "$tag" --notes-file dist/release-notes.md
          else
            gh release create "$tag" \
              --verify-tag \
              --title "ENVPilot ${GITHUB_REF_NAME#v}" \
              --notes-file dist/release-notes.md \
              dist/ENVPilot.dmg dist/ENVPilot.zip dist/ENVPilot.dmg.sha256
          fi
